<title>Můj fitness plán</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1a1c20;--mu:#6b7078;--ac:#e8590c;--ln:#e2e4e8;--ac2:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#121316;--card:#1d1f24;--tx:#f0f1f3;--mu:#9a9fa8;--ac:#ff7a33;--ln:#2e3138;--ac2:#121316;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:640px;margin:0 auto;padding:12px 12px 80px}
h1{font-size:22px;margin:6px 0 12px}h2{font-size:20px;margin:0}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}.top h2{flex:1}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--card);color:var(--tx);border:1px solid var(--ln);cursor:pointer}
button.p{background:var(--ac);color:var(--ac2);border-color:var(--ac);font-weight:600}
button.d{color:#d33}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.wk{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;color:var(--mu)}
.wk b{color:var(--tx)}
.part{display:flex;align-items:center;gap:10px;padding:14px 12px}
.part .n{flex:1;font-size:18px;font-weight:600}.part .c{font-size:13px;color:var(--mu)}
.badge{min-width:38px;text-align:center;border-radius:20px;padding:4px 10px;background:var(--bg);font-weight:700}
.badge.on{background:var(--ac);color:var(--ac2)}
.sets{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 12px;background:var(--card);border:1px solid var(--ln);border-radius:14px;margin-bottom:10px}
.sets .v{font-size:26px;font-weight:700;min-width:40px;text-align:center}
.sets button{width:46px;height:46px;font-size:24px;padding:0}
.ex>summary{list-style:none;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.ex>summary::-webkit-details-marker{display:none}.ex>summary:after{content:"▾";color:var(--mu)}
.ex[open]>summary:after{content:"▴"}
.lb{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 3px}
.tx{white-space:pre-wrap}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px}
textarea{min-height:70px;resize:vertical}
.imgs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.imgs div{position:relative;flex:none}.imgs img{height:130px;border-radius:10px;display:block}
.imgs i{position:absolute;top:4px;right:4px;background:#000a;color:#fff;border-radius:50%;width:26px;height:26px;text-align:center;line-height:26px;font-style:normal}
a{color:var(--ac)}
#ov{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:20}
#ov img{max-width:100%;max-height:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mu{color:var(--mu);font-size:13px}

.rw{display:flex;gap:12px;align-items:center;cursor:pointer}
.th{width:100px;height:100px;border-radius:12px;object-fit:cover;background:var(--bg);flex:none;display:flex;align-items:center;justify-content:center;font-size:30px}
.rw .i{flex:1;min-width:0}.rw .nm{font-weight:600;font-size:17px;line-height:1.25}
.rw .wt{font-size:24px;font-weight:800;color:var(--ac);margin-top:4px}
.rw .wt.e{color:var(--mu);font-weight:500;font-size:14px}
.mv{display:flex;flex-direction:column;gap:4px}.mv button{padding:6px 0;width:46px}
.rw{position:relative}.card.dn{border-color:var(--ac)}
.ck{position:absolute;right:0;bottom:0;width:46px;height:46px;border-radius:12px;border:2px solid var(--mu);background:transparent;font-size:26px;font-weight:700;padding:0;color:var(--ac2)}
.ck.on{background:var(--ac);border-color:var(--ac)}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.pg .card{margin-bottom:0}
.part{flex-direction:column;align-items:stretch;gap:6px;min-height:84px;word-break:break-word}.part .n{flex:none;font-size:17px;line-height:1.2}
.part .c{display:flex;justify-content:space-between;align-items:center}.mh{display:flex;gap:6px}.mh button{flex:1;padding:8px 0}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;padding:11px 4px;font-size:14px;border-radius:20px}.seg button.on{background:var(--ac);color:var(--ac2);border-color:var(--ac);font-weight:600}
.bk{border-color:var(--ac);color:var(--ac);font-weight:600;white-space:nowrap}
.st{position:absolute;right:0;top:0;font-size:26px;line-height:1;color:#f5b301}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:8px 12px;border-radius:20px;font-size:14px}.chip.on{background:var(--ac);color:var(--ac2);border-color:var(--ac);font-weight:600}
.rw{gap:8px;align-items:stretch}
.th{width:auto;flex:1 1 0;min-width:0;height:112px}.th.ph{opacity:.5;font-size:26px}
.th.nmx{flex:2 1 0;justify-content:flex-start;padding:10px;font-weight:600;font-size:16px;text-align:left;line-height:1.25}
.rc{width:74px;flex:none;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between}
.rb{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.rw .wt{font-size:18px;margin:0;text-align:right;line-height:1.1;word-break:break-word}
.ck{position:static;width:38px;height:38px;font-size:22px;border-radius:10px}
.st{position:static;font-size:17px}
.mv button{padding:4px 0}
.oname{flex:1;min-width:0;align-self:center;font-size:18px;font-weight:700;line-height:1.25}
.rc.o{width:auto;flex-direction:row;align-items:center;justify-content:flex-end;gap:10px}.rc.o .rb{flex-direction:row;align-items:center}
.big img{display:block;width:100%;height:auto;border-radius:12px;margin-top:10px}
.po{display:flex;align-items:center;gap:8px;margin-bottom:6px}.po .pn{width:22px;font-weight:700;color:var(--ac)}.po .pm{flex:1;font-weight:600}.po button{padding:7px 0;width:42px}
.pn2{display:flex;align-items:center;gap:10px}
.pi{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:none;background:var(--bg)}.pi.ph{display:flex;align-items:center;justify-content:center;font-size:22px;opacity:.45}
.dt{border-top:1px solid var(--ln);margin-top:12px;padding-top:2px}
</style>
</head>

function fd(d){return d.getDate()+". "+(d.getMonth()+1)+"."}
function planGet(k){return(S.plans&&S.plans[k])||[[],[],[],[],[],[],[]]}
function planFor(k){S.plans=S.plans||{};return S.plans[k]=S.plans[k]||[[],[],[],[],[],[],[]]}
function pgHtml(){
 var h;
 if(V.pg=="warm"){
  h='<div class="top"><button class="bk" data-a="back2">← Partie</button><h2>🔥 Zahřátí</h2></div>';
  if(V.pe)h+='<div class="card"><textarea data-f="warm" style="min-height:320px">'+esc(S.warm)+'</textarea><div class="row"><button class="p" data-a="pdone">Hotovo</button></div></div>';
  else h+='<div class="card">'+(S.warm?'<div class="tx">'+esc(S.warm)+'</div>':'<div class="mu">Zatím nic. Klepni na Upravit a napiš si, jak se zahřívat.</div>')+'<div class="row"><button data-a="pedit">✎ Upravit</button></div></div>';
  return h}
 var D=["Pondělí","Úterý","Středa","Čtvrtek","Pátek","Sobota","Neděle"],td=(new Date().getDay()+6)%7,k=wk(V.po),m=mon(V.po),e=new Date(m);
 e.setDate(e.getDate()+6);
 var P=V.pe?planFor(k):planGet(k);
 h='<div class="top"><button class="bk" data-a="back2">← Partie</button><h2>📅 Plán</h2><button data-a="'+(V.pe?'pdone':'pedit')+'" class="'+(V.pe?'p':'')+'">'+(V.pe?'Hotovo':'✎ Upravit')+'</button></div>'+
 '<div class="card" style="text-align:center"><b>'+fd(m)+' – '+fd(e)+' '+e.getFullYear()+'</b><div class="mu">týden '+(+k.split("-")[1])+(V.po==0?' · tento týden':V.po==1?' · příští týden':V.po==-1?' · minulý týden':'')+'</div></div>'+
 '<div class="seg"><button data-a="ppw">◀ Předchozí</button><button data-a="pw0" class="'+(V.po==0?'on':'')+'">Tento týden</button><button data-a="pnw">Další ▶</button></div>';
 h+=D.map(function(d,i){
  var ids=P[i]=(P[i]||[]).filter(function(id){return S.parts.some(function(q){return q.id==id})}),body,date=new Date(m);date.setDate(date.getDate()+i);
  var sel=ids.map(function(id){return S.parts.find(function(q){return q.id==id})});
  if(V.pe){
   body=sel.map(function(q,j){return'<div class="po"><span class="pn">'+(j+1)+'.</span><span class="pm">'+esc(q.name)+'</span><button data-a="pmu" data-d="'+i+'" data-j="'+j+'"'+(j==0?' disabled':'')+'>▲</button><button data-a="pmd" data-d="'+i+'" data-j="'+j+'"'+(j==sel.length-1?' disabled':'')+'>▼</button><button class="d" data-a="prm" data-d="'+i+'" data-j="'+j+'">✕</button></div>'}).join("");
   var rest=S.parts.filter(function(q){return ids.indexOf(q.id)<0});
   if(rest.length)body+='<div class="lb">Přidat</div><div class="chips">'+rest.map(function(q){return'<button class="chip" data-a="pt" data-d="'+i+'" data-p="'+q.id+'">+ '+esc(q.name)+'</button>'}).join("")+'</div>';
  }else body=sel.length?'<div class="chips">'+sel.map(function(q,j){return'<button class="chip on" data-a="openp" data-p="'+q.id+'">'+(j+1)+'. '+esc(q.name)+'</button>'}).join("")+'</div>':'<div class="mu">volno</div>';
  var tdy=V.po==0&&i==td;
  return'<div class="card'+(tdy?' dn':'')+'"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><b>'+d+' <span class="mu">'+fd(date)+'</span></b>'+(tdy?'<span class="mu">dnes</span>':'')+'</div>'+body+'</div>'}).join("");
 if(V.pe)h+='<div class="row"><button data-a="pcp">⎘ Převzít z předchozího týdne</button></div>';
 return h}
function render(){
 if(V.pg){document.getElementById("app").innerHTML=pgHtml();return}
 var h="",p=curP();
 if(!p){V.p=null;
  var tot=S.parts.reduce(function(a,q){return a+cnt(q.id)},0);
  h='<h1>No pain, no gain! 💪</h1><div class="wk"><button data-a="wp">‹</button><span><b>'+wkLabel()+'</b> · '+tot+' sérií</span><button data-a="wn">›</button></div>'+
  '<div class="pg"><div class="card part"'+(V.hr?'':' data-a="pg" data-x="warm"')+'><div class="n">🔥 Zahřátí</div><div class="c"><span>poznámky</span></div></div><div class="card part"'+(V.hr?'':' data-a="pg" data-x="plan"')+'><div class="n">📅 Týdenní plán</div><div class="c"><span>rozvrh</span></div></div></div><div class="pg">'+S.parts.map(function(q,i){var c=cnt(q.id);return'<div class="card part"'+(V.hr?'':' data-a="open" data-p="'+q.id+'"')+'><div class="n pn2">'+pic(q)+'<span>'+esc(q.name)+'</span></div><div class="c"><span>'+q.ex.length+' cviků</span><span class="badge'+(c?' on':'')+'">'+c+'</span></div>'+(V.hr?'<div class="mh"><button data-a="pmv" data-d="-1" data-x="'+q.id+'"'+(i==0?' disabled':'')+'>◀</button><button data-a="pmv" data-d="1" data-x="'+q.id+'"'+(i==S.parts.length-1?' disabled':'')+'>▶</button></div>':'')+'</div>'}).join("")+'</div>'+
  '<div class="row"><button data-a="addpart">+ Nová partie</button><button data-a="hrd" class="'+(V.hr?'p':'')+'">'+(V.hr?'Hotovo':'↕ Řadit')+'</button></div><div class="row"><button data-a="exp">⬇ Export zálohy</button><button data-a="imp">⬆ Import zálohy</button></div><div class="mu" style="text-align:center;margin-top:20px">Verze '+VER+'</div>';
 }else{
  h='<div class="top"><button class="bk" data-a="back">← Partie</button><h2 class="pn2">'+(p.icon?'<img class="pi" src="'+p.icon+'" alt="">':'')+'<span>'+esc(p.name)+'</span></h2></div>';
  if(V.r)h+='<div class="card" style="display:flex;align-items:center;justify-content:space-between"><b>Řazení cviků</b><button class="p" data-a="rord">Hotovo</button></div>';
  h+='<div class="seg"><button data-a="wk2" class="'+(V.o<-1?'on':'')+'">'+(V.o<-1?'−'+(-V.o)+' týd.':'Starší')+'</button><button data-a="wk1" class="'+(V.o==-1?'on':'')+'">Minulý</button><button data-a="wk0" class="'+(V.o==0?'on':'')+'">Tento</button><button data-a="wk3" class="'+(V.o==1?'on':'')+'">Příští</button></div>'+
  '<div class="sets"><div class="mu"><b style="color:var(--tx)">'+wkLabel()+'</b><br>série · hotovo '+doneN(p)+'/'+p.ex.length+'</div><button data-a="m">−</button><span class="v">'+cnt(p.id)+'</span><button class="p" data-a="pl">+</button></div>';
  h+=p.ex.map(function(x,i){return exHtml(x,i,p.ex.length)}).join("");
  h+='<button class="p" data-a="addex" style="width:100%">+ Přidat cvik</button><div class="row"><button data-a="rord" class="'+(V.r?'p':'')+'">'+(V.r?'Hotovo':'↕ Řadit cviky')+'</button><button data-a="pset">⚙ Partie</button></div>';
  if(V.s)h+='<div class="card" style="margin-top:10px"><div class="lb">Název partie</div><input data-f="pname" value="'+esc(p.name)+'"><div class="lb">Obrázek partie</div><div style="display:flex;align-items:center;gap:10px">'+pic(p)+'<button data-a="piadd">🖼 Vybrat obrázek</button>'+(p.icon?'<button data-a="pirm">Odebrat</button>':'')+'</div><div class="row"><button class="d" data-a="delpart">Smazat partii</button></div></div>';
 }
 document.getElementById("app").innerHTML=h;
}
function fx(id){for(var i=0;i<S.parts.length;i++){var x=S.parts[i].ex.find(function(e){return e.id==id});if(x)return x}}
function curP(){return S.parts.find(function(q){return q.id==V.p})}
function setN(d){var k=wk(V.o);S.sets[k]=S.sets[k]||{};S.sets[k][V.p]=Math.max(0,cnt(V.p)+d)}
function pic(q){return q.icon?'<img class="pi" src="'+q.icon+'" alt="">':'<div class="pi ph">💪</div>'}
function shrink(f,mx){return new Promise(function(r){var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,(mx||900)/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.75))};im.src=rd.result};rd.readAsDataURL(f)})}
document.addEventListener("click",function(ev){
 var t=ev.target.closest("[data-a]");if(!t)return;var a=t.dataset.a,p=curP(),id=t.dataset.x;
 if(a=="open"){V.p=t.dataset.p;V.x=V.ed=null;V.r=V.s=false;scrollTo(0,0)}
 else if(a=="back"){V.p=null;V.x=V.ed=null;V.r=V.s=false}
 else if(a=="tog"){V.x=V.x==id?null:id;V.ed=null}
 else if(a=="ed")V.ed=id;else if(a=="done")V.ed=null;
 else if(a=="rord"){V.r=!V.r;V.x=V.ed=null}
 else if(a=="pset")V.s=!V.s;
 else if(a=="up"||a=="down"||a=="top"){var i=p.ex.findIndex(function(x){return x.id==id}),x=p.ex.splice(i,1)[0],gs=x.top?0:p.ex.filter(function(y){return y.top}).length;p.ex.splice(a=="top"?gs:a=="up"?i-1:i+1,0,x)}
 else if(a=="tg"){var x=fx(id);x.top=!x.top;p.ex=ordered(p)}
 else if(a=="nw"){var x=fx(id),v=prompt("Nová nejtěžší váha:",x.cur);if(!v)return;if(x.cur)x.w=(x.w?x.w+"\n":"")+x.cur+" (do "+new Date().toLocaleDateString("cs-CZ")+")";x.cur=v}
 else if(a=="ck"){var k=wk(V.o);S.done[k]=S.done[k]||{};if(S.done[k][id])delete S.done[k][id];else S.done[k][id]=1}
 else if(a=="pg"){V.pg=id;V.pe=false;V.po=0;scrollTo(0,0)}
 else if(a=="pt"){var arr=planFor(wk(V.po))[+t.dataset.d],pi=arr.indexOf(t.dataset.p);if(pi>-1)arr.splice(pi,1);else arr.push(t.dataset.p)}
 else if(a=="pmu"||a=="pmd"){var ar=planFor(wk(V.po))[+t.dataset.d],j=+t.dataset.j,k2=a=="pmu"?j-1:j+1,tmp=ar[j];ar[j]=ar[k2];ar[k2]=tmp}
 else if(a=="prm"){planFor(wk(V.po))[+t.dataset.d].splice(+t.dataset.j,1)}
 else if(a=="piadd"){document.getElementById("fp").click();return}
 else if(a=="pirm"){p.icon=null}
 else if(a=="ppw")V.po--;else if(a=="pnw")V.po++;else if(a=="pw0")V.po=0;
 else if(a=="pcp"){var cu0=planGet(wk(V.po)).some(function(r){return r.length});if(cu0&&!confirm("Přepsat plán tohoto týdne?"))return;S.plans[wk(V.po)]=JSON.parse(JSON.stringify(planGet(wk(V.po-1))))}
 else if(a=="openp"){V.pg=null;V.pe=false;V.p=t.dataset.p;V.x=V.ed=null;V.r=V.s=false;scrollTo(0,0)}
 else if(a=="back2"){V.pg=null;V.pe=false}
 else if(a=="pedit")V.pe=true;else if(a=="pdone")V.pe=false;
 else if(a=="hrd")V.hr=!V.hr
 else if(a=="pmv"){var i=S.parts.findIndex(function(q){return q.id==id}),j=i+ +t.dataset.d;if(j<0||j>=S.parts.length)return;var q=S.parts.splice(i,1)[0];S.parts.splice(j,0,q)}
 else if(a=="wk0")V.o=0;else if(a=="wk1")V.o=-1;else if(a=="wk3")V.o=1;else if(a=="wk2")V.o=V.o<-1?V.o-1:-2;
 else if(a=="wp")V.o--;else if(a=="wn")V.o=Math.min(1,V.o+1);
 else if(a=="pl")setN(1);else if(a=="m")setN(-1);
 else if(a=="addpart"){var n=prompt("Název partie:");if(!n)return;S.parts.push({id:uid(),name:n,ex:[]})}
 else if(a=="delpart"){if(!confirm("Smazat celou partii včetně cviků?"))return;S.parts=S.parts.filter(function(q){return q!=p});V.p=null;V.s=false}
 else if(a=="addex"){var nx={id:uid(),name:"Nový cvik",cur:"",w:"",n:"",links:"",imgs:[]};p.ex.push(nx);V.x=V.ed=nx.id}
 else if(a=="delex"){if(!confirm("Smazat cvik?"))return;p.ex=p.ex.filter(function(x){return x.id!=id});V.x=V.ed=null}
 else if(a=="addimg"){V.img=id;document.getElementById("fi").click();return}
 else if(a=="rmimg"){fx(id).imgs.splice(+t.dataset.i,1)}
 else if(a=="zoom"){var o=document.getElementById("ov");o.firstChild.src=fx(id).imgs[+t.dataset.s];o.style.display="flex";return}
 else if(a=="exp"){var bl=new Blob([JSON.stringify(S)],{type:"application/json"}),an=document.createElement("a");an.href=URL.createObjectURL(bl);an.download="fitness-zaloha-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(an);an.click();setTimeout(function(){URL.revokeObjectURL(an.href);an.remove()},1500);return}
 else if(a=="imp"){document.getElementById("fj").click();return}
 save();render()});
document.getElementById("fj").onchange=function(){var inp=this,f=inp.files[0];if(!f)return;f.text().then(function(t){try{var d=JSON.parse(t);if(!d.parts||!Array.isArray(d.parts))throw 0;if(!confirm("Načíst zálohu ("+d.parts.length+" partií)? Současná data se přepíšou."))return;S=d;mig();save();V.p=null;V.x=V.ed=null;render()}catch(e){alert("Soubor není platná záloha.")}inp.value=""})};
document.getElementById("fp").onchange=async function(){var p=curP(),f=this.files[0];if(!p||!f)return;p.icon=await shrink(f,240);this.value="";save();render()};
document.getElementById("ov").onclick=function(){this.style.display="none"};
document.addEventListener("change",function(ev){var t=ev.target,f=t.dataset.f;if(!f)return;
 if(f=="pname")curP().name=t.value;else if(f=="warm")S.warm=t.value;else if(f=="plan")S.plan[+t.dataset.d]=t.value;else fx(t.dataset.x)[f]=t.value;save()});
document.getElementById("fi").onchange=async function(){var x=fx(V.img);for(var i=0;i<this.files.length;i++)x.imgs.push(await shrink(this.files[i]));this.value="";save();render()};
load().then(function(d){S=d&&d.parts?d:seed();mig();save();render()});
if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
</script>
</body>
